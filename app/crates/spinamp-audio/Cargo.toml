[package]
name = "spinamp-audio"
version = "0.1.0"
edition = "2024"
description = "Measures tempo, energy, loudness and loudness spikes from short audio previews"

[dependencies]
spinamp-core = { path = "../spinamp-core" }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4"] }
rustfft = "6"

[dev-dependencies]
spinamp-core = { path = "../spinamp-core" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
