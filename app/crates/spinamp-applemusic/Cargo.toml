[package]
name = "spinamp-applemusic"
version = "0.1.0"
edition = "2024"

[dependencies]
spinamp-core = { path = "../spinamp-core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["net", "io-util", "rt", "macros", "time", "sync", "process"] }
jsonwebtoken = "9"
rand = "0.9"
url = "2"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
p256 = { version = "0.13", features = ["pkcs8", "pem", "ecdsa"] }
