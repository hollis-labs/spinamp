[package]
name = "spinamp-services"
version = "0.1.0"
edition = "2024"
description = "External metadata (MusicBrainz) and optional AI intent parsing"

[dependencies]
spinamp-core = { path = "../spinamp-core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "rt", "macros"] }
serde = { version = "1", features = ["derive"] }
