[package]
name = "app"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spinamp-core = { path = "../crates/spinamp-core" }
rand = "0.9"
spinamp-spotify = { path = "../crates/spinamp-spotify" }
spinamp-applemusic = { path = "../crates/spinamp-applemusic" }
spinamp-store = { path = "../crates/spinamp-store" }
spinamp-services = { path = "../crates/spinamp-services" }
spinamp-audio = { path = "../crates/spinamp-audio" }
base64 = "0.22"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }


[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "11"
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
