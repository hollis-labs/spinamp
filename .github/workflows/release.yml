name: release

# Tag a version (git tag v0.1.0 && git push --tags) to build the installers and publish them as a PRERELEASE with SHA256SUMS.
#   Windows: cross-built on build-1 (Linux) with cargo-xwin and signed there with Azure Artifact Signing (hl-sign), if configured.
#   macOS (Apple Silicon): built on the home-laptop self-hosted runner, signed with Developer ID and notarized there.
# Signing credentials live on those machines, not in GitHub secrets. Tag-only trigger: PRs and forks never reach a self-hosted runner.
# See RELEASING.md and Tesseract project/cerberus/knowledge/build-1.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  prepare:
    runs-on: [self-hosted, Linux, X64, build-1]
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the app version
        run: |
          v=$(sed -n 's/.*"version": "\(.*\)",/\1/p' app/src-tauri/tauri.conf.json | head -1)
          [ "v$v" = "${{ github.ref_name }}" ] || { echo "tag ${{ github.ref_name }} != tauri.conf.json version v$v"; exit 1; }
      - name: Create the prerelease if it does not exist
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" \
            --prerelease --title "Spinamp ${{ github.ref_name }}" \
            --notes "Early release. See https://spinamp.fm for install commands. Verify downloads against SHA256SUMS."

  windows:
    needs: prepare
    runs-on: [self-hosted, Linux, X64, build-1]
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../.cache-spinamp-win-target
    steps:
      - uses: actions/checkout@v4
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build (and sign when Azure signing is configured on build-1)
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          cfg='{}'
          if [ -s "$HOME/.config/signing/azure/azure.env" ]; then
            cfg='{"bundle":{"windows":{"signCommand":"'"$GITHUB_WORKSPACE"'/packaging/sign-windows.sh %1"}}}'
          else
            echo "::warning::Azure signing not configured on build-1: Windows installer is UNSIGNED"
          fi
          cargo tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles nsis --config "$cfg"
      - name: Upload
        run: |
          f=$(ls "$CARGO_TARGET_DIR"/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe)
          gh release upload "${{ github.ref_name }}" "$f" --clobber

  macos:
    needs: prepare
    runs-on: [self-hosted, macOS, ARM64, mac]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build, sign, notarize
        id: mac
        run: echo "dmg=$(packaging/release-mac.sh | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Upload
        run: gh release upload "${{ github.ref_name }}" "${{ steps.mac.outputs.dmg }}" --clobber

  checksums:
    needs: [windows, macos]
    runs-on: [self-hosted, Linux, X64, build-1]
    steps:
      - name: Publish SHA256SUMS
        run: |
          d=$(mktemp -d); cd "$d"
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern '*.dmg' --pattern '*-setup.exe' --pattern '*.msi'
          sha256sum * > SHA256SUMS; cat SHA256SUMS
          gh release upload "${{ github.ref_name }}" SHA256SUMS --clobber --repo "${{ github.repository }}"
